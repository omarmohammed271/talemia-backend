version: "3.9"

services:

  # ── Postgres ──────────────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: starrise_db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB:       ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - starrise_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # # ── Pipeline (Bronze → Silver → Gold) ─────────────────────────
  # pipeline:
  #   build:
  #     context: ../starrise_pipeline
  #     dockerfile: Dockerfile
  #   container_name: starrise_pipeline
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   environment:
  #     DB_HOST:     postgres
  #     DB_PORT:     ${DB_PORT}
  #     DB_NAME:     ${DB_NAME}
  #     DB_USER:     ${DB_USER}
  #     DB_PASSWORD: ${DB_PASSWORD}
  #     SOURCE_FILE: data/raw/Starrise_III_-_Dashboard_Engine.xlsx
  #   volumes:
  #     - ../starrise_pipeline/data:/app/data:ro
  #   restart: "no"          # run once then exit

  # ── Django API ────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: starrise_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      # pipeline:
      #   condition: service_completed_successfully
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DEBUG:             ${DEBUG}
      ALLOWED_HOSTS:     ${ALLOWED_HOSTS}
      DB_HOST:           postgres
      DB_PORT:           ${DB_PORT}
      DB_NAME:           ${DB_NAME}
      DB_USER:           ${DB_USER}
      DB_PASSWORD:       ${DB_PASSWORD}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/dashboard/1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  starrise_pgdata:
